<title>Asíntota</title>
<meta name="description" content="Herramientas interactivas para la facultad: microeconomía, macroeconomía, econometría, finanzas, estadística, cálculo, álgebra lineal, investigación operativa y teoría de juegos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior con la marca y el buscador; debajo, una fila de pestañas con todas las materias
   y, dentro de cada materia, una segunda fila con sus temas. El contenido va centrado debajo. */
:root{
  --bg:#0b0c10; --panel:#13141b; --panel-2:#1a1c25; --line:#262935; --fg:#e7e8f0; --muted:#8e93a7; --faint:#565b6f;
  --amber:#f2a93b; --teal:#43c8b8; --rose:#ef7391; --violet:#a69cf6;
  --amber-soft:rgba(242,169,59,.13); --teal-soft:rgba(67,200,184,.15);
  --f-display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--amber)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---- Cabecera ---- */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(11,12,16,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;flex:none;font:700 18px var(--f-mono);color:var(--fg)}
.brand svg{width:24px;height:24px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;width:min(360px,50vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;color:var(--muted);font:13px var(--f-body);cursor:pointer;text-align:left}
.search:hover{border-color:var(--faint)}
.search span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted);background:var(--panel-2)}
.tabs{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tabs .sep{flex:none;width:1px;height:18px;background:var(--line);margin-inline:6px}
.mats-nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 9px 9px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500}
.mats-nav button:hover{color:var(--fg)}
.mats-nav button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--amber)}
.topics-nav{border-top:1px solid var(--line);background:var(--bg)}
.topics-nav .tabs{padding-block:9px;gap:6px}
.topics-nav button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer}
.topics-nav button:hover{color:var(--fg);border-color:var(--faint)}
.topics-nav button[aria-current="true"]{border-color:var(--amber);color:var(--fg);background:var(--amber-soft)}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:28px 70px}

/* ---- Tipografía ---- */
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(32px,5vw,54px);line-height:1.08}
h2{font-size:clamp(24px,3.2vw,34px);line-height:1.15}
h3{font-size:17px;line-height:1.3}
.eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;color:var(--amber)}
.lead{color:var(--muted);font-size:16px;max-width:70ch;margin:12px 0 0}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font:inherit}
.crumb button:hover{color:var(--amber)}

/* ---- Inicio ---- */
.hero{padding-block:18px 10px;max-width:780px}
.hero .lead{font-size:17px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:24px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font:600 28px/1 var(--f-mono);color:var(--fg)}
.hero-stats span{font-size:13px;color:var(--muted);margin-top:6px}
.area{margin-top:38px}
.area-h{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-bottom:14px}
.area-h h2{font-size:22px}
.area-h small{font-size:13px;color:var(--muted)}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mat{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.mat:hover{border-color:var(--amber);transform:translateY(-2px)}
.mat h3{font-size:19px}
.mat p{color:var(--muted);font-size:14px}
.mat ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mat ul li::before{content:"· ";color:var(--amber)}
.mat .go{margin-top:auto;font:500 13px var(--f-mono);color:var(--amber)}

/* ---- Página de materia ---- */
.prog{display:flex;flex-direction:column;gap:24px;margin-top:26px}
.punit h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px;letter-spacing:0}
.punit h3 b{color:var(--fg);font-weight:600}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.topic{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;cursor:pointer;transition:border-color .15s}
.topic:hover{border-color:var(--amber)}
.topic h4{margin:0;font:600 15px var(--f-mono)}
.topic p{color:var(--muted);font-size:13.5px}
.topic .f{font:12px var(--f-mono);color:var(--amber);background:var(--amber-soft);padding:5px 9px;border-radius:5px;align-self:flex-start}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
.pager button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;color:var(--muted);font-size:13px;max-width:48%}
.pager button:hover{border-color:var(--amber);color:var(--fg)}
.pager button b{display:block;color:var(--fg);font-weight:500;margin-top:2px}
.pager .nx{margin-left:auto;text-align:right}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--faint)}

/* ---- Buscador ---- */
.pal{position:fixed;inset:0;z-index:60;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal-box{width:min(640px,100%);background:var(--panel);border:1px solid var(--faint);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-list button{display:flex;gap:12px;align-items:baseline;width:100%;background:none;border:0;border-radius:6px;text-align:left;padding:8px 10px;cursor:pointer;color:var(--fg);font-size:14px}
.pal-list button small{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.pal-list button[aria-selected="true"]{background:var(--amber-soft)}
.pal-empty{padding:16px;color:var(--muted);font-size:14px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:9px 15px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1205}
.btn.primary:hover{background:#f6b856}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
@media (max-width:600px){.search kbd{display:none}.search{width:auto;flex:1}.brand span{display:none}}

/* Herramientas */
.tool-head{margin-bottom:22px}
.bench{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.bench > *{min-width:0}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stage canvas{width:100%;display:block;border-radius:6px}
label.l{display:block;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--f-mono);font-size:14px}
.field:focus{border-color:var(--amber);outline:none}
textarea.field{min-height:150px;resize:vertical;line-height:1.5}
select.field{font-family:var(--f-body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:12px var(--f-mono);cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--amber)}
.drill{margin-top:28px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:14px}
.drill-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.drill-h h3{margin:4px 0 0}
.drill-q{font-size:15px;line-height:1.6;max-width:75ch}
.drill-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.drill-in{display:flex;flex-direction:column;gap:6px;position:relative;font:12px var(--f-mono);color:var(--muted)}
.drill-in i{position:absolute;right:10px;bottom:8px;font-style:normal;font-weight:700}
.drill-in.good input{border-color:var(--teal)}.drill-in.good i{color:var(--teal)}
.drill-in.bad input{border-color:var(--rose)}.drill-in.bad i{color:var(--rose)}
.drill-good{color:var(--teal)}.drill-bad{color:var(--rose)}
.drill-tag{display:inline-block;margin-top:8px;margin-left:6px;font:11px var(--f-mono);color:var(--teal);border:1px solid var(--teal-soft);border-radius:999px;padding:2px 8px}
.sv{font:inherit;font-family:var(--f-mono);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--faint);width:9ch;padding:0 2px;margin-left:2px;text-transform:none;letter-spacing:0;border-radius:0}
.sv:hover{border-bottom-color:var(--amber)}.sv:focus{outline:none;border-bottom:1px solid var(--amber);background:var(--panel-2)}

.l .gk{text-transform:none}
.err{color:var(--rose);font:12px var(--f-mono);min-height:0}
.note{font-size:13px;color:var(--muted)}
.explain{border-left:2px solid var(--amber);padding:2px 0 2px 14px;color:var(--muted);font-size:14px}
.explain b{color:var(--fg);font-weight:500}

/* Graficador */
.fn{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px}
.fn .err{grid-column:2}
.fn .pre,.fn-in .pre{font:14px var(--f-mono);color:var(--muted);white-space:nowrap}
.fn-in{display:flex;align-items:center;gap:6px}
#g-cv{height:min(62vh,560px);touch-action:none;cursor:grab;background:var(--bg)}
#g-cv:active{cursor:grabbing}
.readout{font:13px var(--f-mono);color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap;min-height:20px}
.readout b{font-weight:500}

/* Estadística */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.st{background:var(--panel);padding:11px 13px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.st dt{font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st dd{margin:4px 0 0;font:500 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.summary{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.summary b{color:var(--fg);font-weight:500}
#s-cv{height:330px}

/* Monty Hall */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.door{aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--panel-2),var(--panel));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;transition:border-color .15s,transform .15s}
.door:hover:not([disabled]){border-color:var(--faint);transform:translateY(-2px)}
.door[disabled]{cursor:default}
.door .num{font:600 44px/1 var(--f-display)}
.door .what{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.door.picked{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.door.goat{background:var(--bg)}
.door.goat .num{color:var(--faint)}
.door.car{background:var(--amber-soft);border-color:var(--amber)}
.door.car .what{color:var(--amber)}
.door .you{position:absolute;top:8px;font:11px var(--f-mono);color:var(--amber)}
.msg{font-size:16px;min-height:52px}
.msg b{font-weight:600}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.score small{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.score strong{display:block;font:500 18px var(--f-mono);margin-top:3px}
#m-cv{height:280px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
ol.steps b{color:var(--fg);font-weight:500}

/* Cumpleaños */
.big{font:600 52px/1.05 var(--f-display);color:var(--amber);letter-spacing:-.03em}
.formula{font:13px/1.7 var(--f-mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.formula b{color:var(--fg);font-weight:500}
#b-cv{height:260px}
.cal{display:grid;grid-template-columns:2.2rem repeat(31,minmax(0,1fr));gap:2px;align-items:center}
.cal .m{font:10px var(--f-mono);color:var(--faint);text-transform:uppercase}
.cal .d{aspect-ratio:1;border-radius:2px;background:var(--panel-2)}
.cal .d.x{visibility:hidden}
.cal .d.one{background:var(--teal)}
.cal .d.dup{background:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}

/* TCL */
#t-base{height:130px}
#t-cv{height:330px}

/* ---- Controles extra ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2 > *,.grid3 > *{min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--amber);width:16px;height:16px}
input.field[type=number]{-moz-appearance:textfield}
.out{font:500 15px var(--f-mono);color:var(--fg)}
.big.sm{font-size:34px}
.kv{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:500;font-family:var(--f-mono)}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tbl tr.best td{color:var(--amber)}
.mtx{display:inline-grid;gap:2px 14px;padding:6px 12px;border-left:2px solid var(--faint);border-right:2px solid var(--faint);border-radius:4px;font:14px var(--f-mono);font-variant-numeric:tabular-nums}
.mtx span{text-align:right}
.mtx .bar{display:block;height:auto;max-width:none;margin:0;padding:0 0 0 12px;border-left:1px dashed var(--faint)}
.mtx .piv{color:var(--amber)}
.steplist{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.step p{font-size:14px;color:var(--muted)}
.step p b{color:var(--fg);font-weight:500}
.mtx-in{display:grid;gap:6px;align-items:center}
.mtx-in input{width:100%;min-width:0;text-align:center;padding:7px 4px}
.mtx-in .sep{font:13px var(--f-mono);color:var(--muted);text-align:center}
.pill{display:inline-block;font:12px var(--f-mono);padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.bad{background:rgba(239,115,145,.15);color:var(--rose)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.barrow > *{min-width:0}
.barrow .track{height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.barrow .fillb{height:100%;background:var(--amber);border-radius:3px}
.barrow .v{font:13px var(--f-mono);text-align:right}
.payoff{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.payoff .h{font:12px var(--f-mono);color:var(--muted);text-align:center}
.payoff .cell{display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px}
.payoff .cell.eq{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.payoff .cell input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:14px var(--f-mono);padding:4px 0}
.payoff .cell input.a{color:var(--amber)}
.payoff .cell input.b{color:var(--teal)}
.payoff .cell input.br{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.payoff .cell i{color:var(--faint);font-style:normal}
.cv-tall{height:min(64vh,560px)}
.cv-md{height:360px}
.cv-sm{height:220px}
.coin-strip{font:13px var(--f-mono);color:var(--muted);word-break:break-all;line-height:1.7}
.coin-strip b{color:var(--amber);font-weight:500}
@media (max-width:520px){.barrow{grid-template-columns:96px 1fr 44px}.grid3{grid-template-columns:1fr 1fr}}

.grp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-bottom:14px}
.grp-h h2{font-size:clamp(22px,3vw,28px)}
.tool-head{margin-bottom:22px}
.tool-head h2{margin-top:6px}
@media (max-width:1100px){.bench{grid-template-columns:1fr}}
@media (max-width:520px){.big{font-size:40px}.door .num{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="head">
  <div class="bar">
    <button class="brand" data-go="inicio" aria-label="Asíntota, inicio">
      <svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M3 2v21h21" stroke="#565b6f" stroke-width="1.6"/><path d="M6 3c1 9 4 14.5 17 16.5" stroke="#f2a93b" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Asíntota</span>
    </button>
    <button class="search" id="search-btn" aria-label="Buscar un tema"><span>Buscar un tema…</span><kbd>Ctrl K</kbd></button>
  </div>
  <nav class="tabs mats-nav" id="mats-nav" aria-label="Materias"></nav>
  <div class="topics-nav" id="topics-wrap" hidden><nav class="tabs" id="topics-nav" aria-label="Temas de la materia"></nav></div>
</header>

<main>
  <section id="v-inicio" data-view>
    <div class="hero">
      <p class="eyebrow">Herramientas interactivas para la facultad</p>
      <h1 style="margin-top:12px">Elegí una materia y empezá a practicar.</h1>
      <p class="lead">Cada tema tiene una herramienta donde movés los números y ves el modelo responder, con las cuentas paso a paso y explicado en criollo.</p>
      <div class="hero-cta"><button class="btn primary" data-go="mat-micro">Empezar por Microeconomía</button><button class="btn" id="hero-search">Buscar un tema</button></div>
      <div class="hero-stats" id="h-stats"></div>
    </div>
    <div id="areas"></div>
  </section>
  <div id="matviews"></div>
  <div id="tools"></div>
  <footer class="foot"><span>Asíntota</span><span>Hecho por Francisco Epherra</span></footer>
</main>

<div class="pal" id="pal" hidden role="dialog" aria-label="Buscar">
  <div class="pal-box">
    <div class="pal-in"><input id="pal-q" placeholder="Escribí un tema: elasticidad, IS-LM, bonos, Lagrange…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
    <div class="pal-list" id="pal-list" role="listbox"></div>
  </div>
</div>
